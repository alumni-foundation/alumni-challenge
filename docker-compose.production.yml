# Production stack for Coolify on the same server as staging.
# Postgres, Redis, and the API stay on this compose network. The API has no
# public port: the web container calls it at http://api:8000.
# The web app is published on host port 3001 so it does not take staging's port.
# Cloudflare proxies https://appalumni.africa to Coolify. Staging keeps its
# own compose file and the Coolify Traefik hostname.

name: alumni-challenge-production

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alumni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-alumni_challenge_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alumni} -d ${POSTGRES_DB:-alumni_challenge_prod}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/alumni-foundation/alumni-challenge-api:production
    pull_policy: always
    restart: unless-stopped
    environment: &backend_env
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY}
      TICKET_SIGNING_KEY: ${TICKET_SIGNING_KEY:-}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      FRONTEND_URL: ${FRONTEND_URL:-https://appalumni.africa}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-["https://appalumni.africa"]}
      TRUSTED_CLIENT_IP_HEADER: ${TRUSTED_CLIENT_IP_HEADER:-x-visitor-ip}
      PASSWORD_HASH_CONCURRENCY: ${PASSWORD_HASH_CONCURRENCY:-2}
      MAIL_BACKEND: ${MAIL_BACKEND:-resend}
      MAIL_FROM: "${MAIL_FROM:-Alumni Challenge <no-reply@appalumni.africa>}"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-r2}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers $$WEB_CONCURRENCY --timeout-keep-alive 75 --no-access-log
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  worker:
    image: ghcr.io/alumni-foundation/alumni-challenge-api:production
    pull_policy: always
    restart: unless-stopped
    environment: *backend_env
    command: ["arq", "app.worker.WorkerSettings"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "arq", "--check", "app.worker.WorkerSettings"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  web:
    image: ghcr.io/alumni-foundation/alumni-challenge-web:production
    pull_policy: always
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
    ports:
      - "3001:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

name: alumni-challenge

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: alumni
      POSTGRES_PASSWORD: alumni_dev_password
      POSTGRES_DB: alumni_challenge
    ports:
      - "5432:5432"
    volumes:
      # Named volume: persists across `docker compose down` and container
      # rebuilds. Only `docker compose down -v` destroys it — never a plain
      # restart, rebuild, or `docker compose up`. This is the persistent
      # Postgres volume from day one.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alumni -d alumni_challenge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every email the app sends in development. Read them in a browser at
  # http://localhost:8025 (verification and password reset links are in there).
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  # An S3-compatible object store for development, so the same code path as production
  # (Cloudflare R2) runs on your machine. MinIO's official images are no longer published, so
  # this is Adobe's S3Mock. It ignores credentials and keeps files in memory.
  # To use it from the app, set in backend/.env:
  #   STORAGE_BACKEND=r2
  #   STORAGE_ENDPOINT_URL=http://s3mock:9090
  #   STORAGE_ACCESS_KEY=dev   STORAGE_SECRET_KEY=dev   STORAGE_BUCKET_NAME=alumni-dev
  s3mock:
    image: adobe/s3mock:latest
    restart: unless-stopped
    environment:
      initialBuckets: alumni-dev,alumni-test
    ports:
      - "9090:9090"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://alumni:alumni_dev_password@postgres:5432/alumni_challenge
      REDIS_URL: redis://redis:6379/0
      # Development sends all email to Mailpit (http://localhost:8025). Tests force
      # MAIL_BACKEND=logging, so they never send anything.
      MAIL_BACKEND: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: Alumni Challenge <no-reply@alumni.local>
      # Where the object-storage tests find the emulator above.
      TEST_S3_ENDPOINT_URL: http://s3mock:9090
      # Where the mail tests find Mailpit.
      TEST_SMTP_HOST: mailpit
      TEST_MAILPIT_API: http://mailpit:8025
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - api_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://alumni:alumni_dev_password@postgres:5432/alumni_challenge
      REDIS_URL: redis://redis:6379/0
      # Development sends all email to Mailpit (http://localhost:8025). Tests force
      # MAIL_BACKEND=logging, so they never send anything.
      MAIL_BACKEND: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: Alumni Challenge <no-reply@alumni.local>
    volumes:
      - ./backend:/app
      - worker_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Overrides the HTTP healthcheck baked into the image: the worker has no web port.
    healthcheck:
      test: ["CMD-SHELL", "/app/.venv/bin/arq --check app.worker.WorkerSettings"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    command: >
      uv run arq app.worker.WorkerSettings

volumes:
  postgres_data:
    name: alumni_challenge_postgres_data
  redis_data:
    name: alumni_challenge_redis_data
  # Keep each container's virtualenv off the bind mount: on Windows the mount is
  # far too slow to hold a .venv.
  api_venv:
  worker_venv:

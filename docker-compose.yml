name: alumni-challenge

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: alumni
      POSTGRES_PASSWORD: alumni_dev_password
      POSTGRES_DB: alumni_challenge
    ports:
      - "5432:5432"
    volumes:
      # Named volume: persists across `docker compose down` and container
      # rebuilds. Only `docker compose down -v` destroys it — never a plain
      # restart, rebuild, or `docker compose up`. This is the persistent
      # Postgres volume from day one.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alumni -d alumni_challenge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://alumni:alumni_dev_password@postgres:5432/alumni_challenge
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://alumni:alumni_dev_password@postgres:5432/alumni_challenge
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      uv run arq app.worker.WorkerSettings

volumes:
  postgres_data:
    name: alumni_challenge_postgres_data
  redis_data:
    name: alumni_challenge_redis_data

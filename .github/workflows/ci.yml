name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alumni
          POSTGRES_PASSWORD: alumni_test_password
          POSTGRES_DB: alumni_challenge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alumni -d alumni_challenge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: development
      SECRET_KEY: ci-test-secret-key
      DATABASE_URL: postgresql+asyncpg://alumni:alumni_test_password@localhost:5432/alumni_challenge_test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy type check
        run: uv run mypy app

      - name: Run tests
        run: uv run pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push yet — Phase 1 just proves it builds)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: alumni-challenge-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
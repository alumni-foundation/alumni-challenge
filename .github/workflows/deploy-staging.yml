name: Deploy staging

on:
  push:
    branches: [staging]

jobs:
  tests:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci.yml

  publish:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API image tags
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-api
          flavor: latest=false
          tags: |
            type=raw,value=staging
            type=sha,format=long,prefix=

      - name: Publish the API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: production
          push: true
          platforms: linux/amd64
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          cache-from: type=gha,scope=staging-api
          cache-to: type=gha,scope=staging-api,mode=max

      - name: Web image tags
        id: web-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-web
          flavor: latest=false
          tags: |
            type=raw,value=staging
            type=sha,format=long,prefix=

      - name: Publish the web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          target: production
          push: true
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_CONTACT_EMAIL=${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          cache-from: type=gha,scope=staging-web
          cache-to: type=gha,scope=staging-web,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Ask Coolify to deploy staging
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_STAGING_WEBHOOK: ${{ secrets.COOLIFY_STAGING_WEBHOOK }}
        run: |
          if [ -z "$COOLIFY_TOKEN" ] || [ -z "$COOLIFY_STAGING_WEBHOOK" ]; then
            echo "Set the COOLIFY_TOKEN and COOLIFY_STAGING_WEBHOOK repository secrets, then re-run this job."
            exit 1
          fi
          curl --fail-with-body --request GET "$COOLIFY_STAGING_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
